// ---- line up for a play when YOU have the ball (then pick a play) ----
function setupPlay() {
  const L = G.los, n = CONFIG.MY_TEAM.numbers;
  G.offense = [
    makePlayer('me', 'qb', 15, Math.max(L - 4, OWN_GOAL + 1.2), n[0], 0),
    makePlayer('me', 'c',  15, L - 0.4, n[1], 1),
    makePlayer('me', 'wl', 5.5, L - 0.6, n[2], 2),
    makePlayer('me', 'wr', 24.5, L - 0.6, n[3], 3),
    makePlayer('me', 'sl', 20, L - 1.6, n[4], 4),
  ];
  G.qb = G.offense[0]; G.rb = null;
  const spots = CONFIG.DEEP_SAFETY
    ? [ [15, L + CONFIG.RUSH_LINE, 'rush', null], [15, L + 11, 'deep', null], [5.5, L + 4.5, 'cover', 2],
        [24.5, L + 4.5, 'cover', 3], [20, L + 5.5, 'cover', 4], [15, L + 4, 'cover', 1], [21, L + 12, 'deep', null] ]
    : [ [15, L + CONFIG.RUSH_LINE, 'rush', null], [15, L + 4, 'cover', 1], [5.5, L + 4.5, 'cover', 2],
        [24.5, L + 4.5, 'cover', 3], [20, L + 5.5, 'cover', 4], [10, L + 12, 'deep', null], [21, L + 12, 'deep', null] ];
  G.defense = [];
  for (let i = 0; i < clamp(CONFIG.DEFENDER_COUNT, 1, 7); i++) {
    const s = spots[i], d = makePlayer('opp', s[2], s[0], Math.min(s[1], FL - 1), CONFIG.OPP_TEAM.numbers[i], i + 5);
    d.cover = s[3] != null ? G.offense[s[3]] : null; G.defense.push(d);
  }
  G.carrier = G.qb; G.controlled = G.qb; G.openReceiver = null; G.ball = null; G.aim = null;
  G.phase = 'pre'; G.playT = 0; G.stateT = 0; G.presnapTime = 1.4;
  G.stamina = 1; G.jukeCd = 0; G.breakaway = false; G.turboOn = false;
  G.state = 'playcall';
  if (!playAllowed(G.playHover)) G.playHover = 0;
  lineUpFor(G.playHover);
}
function runAllowed() {            // NFL Flag "no-run zones": 5 yards before midfield and before the goal line
  if (!CONFIG.NO_RUN_ZONES) return true;
  const L = G.los;
  return !((!G.gotFirstDown && L >= MIDFIELD - 5 && L < MIDFIELD) || L >= OPP_GOAL - 5);
}
function playAllowed(i) { return !!PLAYS[i] && (!PLAYS[i].run || runAllowed()); }
function lineUpFor(i) {             // the slot receiver moves into the backfield for a HANDOFF
  const sl = G.offense[4], L = G.los, run = PLAYS[i].run;
  sl.x = run ? 12.5 : 20; sl.y = run ? Math.max(L - 4.2, OWN_GOAL + 1) : L - 1.6; sl.vx = sl.vy = 0; sl.role = run ? 'rb' : 'sl';
  G.rb = run ? sl : null;
  const d = G.defense.find(d => d.cover === sl); if (d) { d.x = run ? 13 : 20; d.y = Math.min(FL - 1, L + (run ? 6 : 5.5)); }
}
function hoverPlay(step, idx) {
  let i = idx != null ? idx : G.playHover;
  if (idx == null) for (let k = 0; k < 4; k++) { i = (i + step + 4) % 4; if (playAllowed(i)) break; }
  if (!playAllowed(i)) return;
  G.playHover = i; lineUpFor(i); Sound.click();
}
function choosePlay(i) {
  if (G.state !== 'playcall') return;
  if (!playAllowed(i)) { showMsg('NO-RUN ZONE', 'Too close to the line - pick a pass!', '#ffd000', 1.4); Sound.click(); return; }
  G.playIdx = i; G.playHover = i; lineUpFor(i);
  G.state = 'presnap'; G.stateT = 0; G.presnapTime = 1.4; Sound.click();
}

// ---- line up for a play when the HAWKS have the ball (they run toward YOUR end zone) ----
function setupDefPlay() {
  const L = G.los, n = CONFIG.OPP_TEAM.numbers, m = CONFIG.MY_TEAM.numbers, cy = y => clamp(y, 0.5, FL - 0.5);
  G.offense = [
    makePlayer('opp', 'qb', 15, cy(L + 4), n[0], 0),
    makePlayer('opp', 'c',  15, cy(L + 0.4), n[1], 1),
    makePlayer('opp', 'wr', 5.5, cy(L + 0.6), n[2], 2),
    makePlayer('opp', 'wr', 24.5, cy(L + 0.6), n[3], 3),
    makePlayer('opp', 'rb', 11.5, cy(L + 4.2), n[4], 4),
  ];
  G.qb = G.offense[0]; G.rb = G.offense[4];
  // your 5 defenders: #0 is the one you control at first (starts at the 7-yard rush line)
  const spots = [ [15, L - CONFIG.RUSH_LINE, 'spy', null], [15, L - 4, 'cover', 1], [5.5, L - 4.5, 'cover', 2],
                  [24.5, L - 4.5, 'cover', 3], [11.5, L - 5.5, 'cover', 4] ];
  G.defense = spots.map((s, i) => { const d = makePlayer('me', s[2], s[0], cy(s[1]), m[i], i); d.cover = s[3] != null ? G.offense[s[3]] : null; return d; });
  G.carrier = G.qb; G.controlled = G.defense[0]; G.openReceiver = null; G.ball = null; G.aim = null;
  G.phase = 'pre'; G.playT = 0; G.state = 'presnap'; G.stateT = 0; G.presnapTime = 1.4;
  G.playType = Math.random() < CONFIG.HAWKS_PASS_CHANCE ? 'pass' : 'run';
  G.throwAt = rand(CONFIG.HAWKS_THROW_TIME[0], CONFIG.HAWKS_THROW_TIME[1]);
}

// routes for receivers. dir = +1 when you have the ball (your play call), -1 when the Hawks do (random)
function playRoutes(i) {          // your play's routes as field spots (also used to draw them)
  const L = G.los, cx = x => clamp(x, 1.5, FW - 1.5), cy = y => clamp(y, 1, FL - 1), out = new Map();
  G.offense.forEach(p => {
    if (p.role === 'qb' || p.role === 'rb') return;
    out.set(p, (PLAYS[i].routes[p.role] || []).map(([a, b]) => ({ x: cx(p.x + a), y: cy(L + b) })));
  });
  return out;
}
function makeRoutes(dir) {
  const L = G.los, cx = x => clamp(x, 1.5, FW - 1.5), cy = y => clamp(y, 1, FL - 1);
  if (dir > 0) {
    const r = playRoutes(G.playIdx);
    G.offense.forEach(p => { p.route = r.get(p) || []; p.routeI = 0; });
    return;
  }
  G.offense.forEach(p => {
    if (p.role === 'qb') return;
    const inDir = p.x < 15 ? 1 : -1, x = p.x;
    let r;
    if (p.role === 'c') r = [[15, 2], [15 + pick([-1, 1]) * rand(6, 9), 4.5], [15 + pick([-1, 1]) * 4, 30]];
    else if (p.role === 'rb') { const sx = p.x < 15 ? 3 : 27; r = [[sx, -1], [sx, 14]]; }        // swing route to the side
    else r = pick([
      [[x, 32]],                                                          // go
      [[x, 3], [x + inDir * 9, 11], [x + inDir * 13, 40]],                // slant
      [[x, 6], [x - inDir * 6, 7], [x - inDir * 6, 40]],                  // out
      [[x, 8], [x + inDir * 7, 20], [x + inDir * 9, 40]],                 // post
      [[x, 7], [x + inDir * 1.5, 5.5]],                                   // curl (stops)
    ]);
    p.route = r.map(([a, b]) => ({ x: cx(a), y: cy(L + b * dir) })); p.routeI = 0;
  });
}

/* ==========================================================================
   10) GAME LOGIC
   ========================================================================== */
function showMsg(big, small, color = '#ffffff', dur = 1.6) { G.msg = { big, small, color, t: 0, dur }; }

// ---- the announcer: a banner on screen + (optional) a voice ----
function announce(text) {
  G.callout = { text, t: 0, dur: 1.6 };
  if (!CONFIG.ANNOUNCER_VOICE || Sound.muted || !window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[!.]/g, '').toLowerCase());
    u.rate = 1.15; u.pitch = 1.1; u.volume = 0.9; speechSynthesis.speak(u);
  } catch (e) {}
}
function slowMo(sec) { if (CONFIG.SLOW_MOTION < 1) G.slowmo = Math.max(G.slowmo, sec); }

function steer(p, tx, ty, speed, dt, accel = 9) {
  let dx = tx - p.x, dy = ty - p.y; const d = Math.hypot(dx, dy);
  let vx = 0, vy = 0;
  if (d > 0.05) { const s = Math.min(speed, d * 4); vx = dx / d * s; vy = dy / d * s; }
  const k = Math.min(1, dt * accel);
  p.vx += (vx - p.vx) * k; p.vy += (vy - p.vy) * k;
}
function chase(p, tx, ty, speed, dt, accel = 9) {   // like steer, but full speed THROUGH the spot (for pursuit)
  const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy) || 0.001;
  steer(p, p.x + dx / d * 10, p.y + dy / d * 10, speed, dt, accel);
}
function move(p, dt) {
  p.x += p.vx * dt; p.y += p.vy * dt;
  p.x = clamp(p.x, WORLD.minX + 2, WORLD.maxX - 2); p.y = clamp(p.y, -6, FL + 6);
  const sp = Math.hypot(p.vx, p.vy); p.anim += sp * dt * 2.2;
}
function separate(list) {     // teammates spread out instead of stacking on each other
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
    const a = list[i], b = list[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d < 1.3 && d > 0.001) { const push = (1.3 - d) * 2; a.vx -= dx / d * push; a.vy -= dy / d * push; b.vx += dx / d * push; b.vy += dy / d * push; }
  }
}
function moveControlled(dt) {  // the kid you control (offense OR defense)
  const c = G.controlled; if (!c) return;
  const inp = readInput(), wd = screenDirToWorld(inp.dx, inp.dy);
  let sp = CONFIG.PLAYER_SPEED;
  const runner = G.side === 'off' && c === G.carrier && G.phase === 'run';
  if (runner) {                 // TURBO uses stamina; resting fills it back up
    G.turboOn = inp.turbo && G.stamina > 0.02 && Math.hypot(inp.dx, inp.dy) > 0.3;
    if (G.turboOn) { sp = CONFIG.TURBO_SPEED; G.stamina = Math.max(0, G.stamina - dt * CONFIG.STAMINA_DRAIN); }
    else G.stamina = Math.min(1, G.stamina + dt * CONFIG.STAMINA_REGEN);
  }
  let tvx = wd.x * sp, tvy = wd.y * sp;
  if (G.side === 'off' && c === G.qb && G.phase === 'pre' && !CONFIG.QB_CAN_RUN && c.y + tvy * 0.02 > G.los - 0.5) tvy = Math.min(tvy, 0);
  if (runner && c.jukeT > 0) { tvx += c.jukeDir * CONFIG.JUKE_BURST * 1.4; tvy *= 0.7; }
  const k = Math.min(1, dt * (c.jukeT > 0 ? 20 : 12)); c.vx += (tvx - c.vx) * k; c.vy += (tvy - c.vy) * k;
}
function pullFlag(carrier, puller) {   // flag flies up in the air!
  const col = carrier.team === 'me' ? CONFIG.MY_TEAM.flags : CONFIG.OPP_TEAM.flags;
  carrier.flagGone = true; puller.holdFlag = col;
  G.flyingFlags.push({ x: carrier.x, y: carrier.y, z: 0.6, vz: 9, rot: 0, vr: rand(10, 16) * pick([-1, 1]), color: col, life: 1.3, t: 0 });
  Sound.pull();
}
function launchBall(qb, r, speed) {   // the Hawks QB throws
  const d = dist(qb, r), flight = Math.max(0.35, d / speed);
  const tx = clamp(r.x + r.vx * flight, 0.8, FW - 0.8), ty = clamp(r.y + r.vy * flight, 0.3, FL - 0.3);
  G.ball = { fx: qb.x, fy: qb.y, tx, ty, t: 0, dur: flight, target: r, peak: 1.2 + d * 0.07, tried: false };
  G.carrier = null; G.phase = 'air'; G.openReceiver = null;
  Sound.throw();
}
function celebrate(big, small, after) {
  G.state = 'td'; G.stateT = 0; G.afterCelebrate = after; G.ball = null; G.aim = null;
  Sound.whistle(); Sound.touchdown();
  showMsg(big, small, '#ffd000', 3.2);
  for (let i = 0; i < 160; i++) spawnConfetti();
}

/* ---------------- OFFENSE (you have the ball) ---------------- */
function canThrow() {
  return G.side === 'off' && G.state === 'live' && G.phase === 'pre' && G.carrier === G.qb && !PLAYS[G.playIdx].run;
}
function flightTime(d) { return Math.max(0.35, d / CONFIG.BALL_SPEED) + 0.1; }
function throwTo(r) {             // quick pass: lead the receiver
  if (!canThrow() || !r) return;
  const f = flightTime(dist(G.qb, r));
  throwAtSpot(r.x + r.vx * f, r.y + r.vy * f, r);
}
function throwAtSpot(tx, ty, target) {
  if (!canThrow()) return;
  const qb = G.qb;
  let d = Math.hypot(tx - qb.x, ty - qb.y);
  if (d > CONFIG.AIM_MAX_DIST) { tx = qb.x + (tx - qb.x) * CONFIG.AIM_MAX_DIST / d; ty = qb.y + (ty - qb.y) * CONFIG.AIM_MAX_DIST / d; d = CONFIG.AIM_MAX_DIST; }
  if (!target) {                  // nobody picked? the closest buddy goes for it
    let bd = 7; G.offense.forEach(p => { if (p === qb) return; const dd = Math.hypot(p.x - tx, p.y - ty); if (dd < bd) { bd = dd; target = p; } });
  }
  G.ball = { fx: qb.x, fy: qb.y, tx, ty, t: 0, dur: flightTime(d), target: target || null, peak: 1.2 + d * 0.07, tried: false };
  G.carrier = null; G.phase = 'air'; G.openReceiver = null; G.controlled = null; G.aim = null;
  G.defense.forEach(df => df.react = rand(0.05, 0.2));
  Sound.throw();
}
// drag-to-aim: where the ball will land, with a small "magnet" that leads a buddy you aimed near
function aimTarget(a) {
  const qb = G.qb; let tx = a.x, ty = a.y, d = Math.hypot(tx - qb.x, ty - qb.y);
  if (d > CONFIG.AIM_MAX_DIST) { tx = qb.x + (tx - qb.x) * CONFIG.AIM_MAX_DIST / d; ty = qb.y + (ty - qb.y) * CONFIG.AIM_MAX_DIST / d; d = CONFIG.AIM_MAX_DIST; }
  const f = flightTime(d);
  let best = null, bd = CONFIG.AIM_ASSIST;
  G.offense.forEach(p => {
    if (p === qb) return;
    const px = p.x + p.vx * f, py = p.y + p.vy * f;
    const m = Math.min(Math.hypot(px - tx, py - ty), Math.hypot(p.x - tx, p.y - ty));
    if (m < bd) { bd = m; best = { r: p, x: px, y: py }; }
  });
  if (best) return { x: lerp(tx, best.x, 0.7), y: lerp(ty, best.y, 0.7), r: best.r, d, max: d >= CONFIG.AIM_MAX_DIST };
  return { x: tx, y: ty, r: null, d, max: d >= CONFIG.AIM_MAX_DIST };
}
function aimRelease() {
  const a = G.aim; G.aim = null;
  if (!a || !canThrow()) return;
  if (Math.hypot(a.x - G.qb.x, a.y - G.qb.y) < 2.5) return;   // tiny drag near the QB = never mind
  const t = aimTarget(a); throwAtSpot(t.x, t.y, t.r);
}
function findOpenReceiver() {
  let best = null, bestScore = -1e9;
  G.offense.forEach(p => {
    if (p === G.qb || p.role === 'rb') return;
    let near = 1e9; G.defense.forEach(d => near = Math.min(near, dist(p, d)));
    const score = Math.min(near, 8) + (p.y - G.qb.y) * 0.08;
    if (score > bestScore) { bestScore = score; best = p; }
  });
  return best;
}
// JUKE! a spin move: you cut sideways, nearby Hawks stumble, and nobody can grab your flag for a moment
function doJuke() {
  const c = G.controlled;
  if (G.side !== 'off' || G.state !== 'live' || G.phase !== 'run' || c !== G.carrier) return false;
  if (G.jukeCd > 0 || G.stamina < CONFIG.JUKE_COST) return false;
  G.stamina -= CONFIG.JUKE_COST; G.jukeCd = CONFIG.JUKE_COOLDOWN;
  let nd = null, ndd = 1e9; G.defense.forEach(d => { const dd = dist(d, c); if (dd < ndd) { ndd = dd; nd = d; } });
  c.jukeDir = nd ? (c.x >= nd.x ? 1 : -1) : (c.x < 15 ? 1 : -1);
  if (c.x < 3) c.jukeDir = 1; if (c.x > FW - 3) c.jukeDir = -1;
  c.jukeT = 0.3; c.spin = 0; c.safeT = Math.max(c.safeT, CONFIG.JUKE_SAFE_TIME);
  let faked = 0;                  // the closest Hawk (if he's close enough) bites on the fake
  if (nd && ndd < CONFIG.JUKE_FAKE_RADIUS && nd.react <= 0 && Math.random() < CONFIG.JUKE_SUCCESS) { nd.react = CONFIG.JUKE_FAKE_TIME; nd.vx *= 0.3; nd.vy *= 0.3; faked = 1; }
  Sound.juke();
  if (faked) { announce(pick(['JUKE!', 'WHAT A MOVE!', 'SHAKE AND BAKE!', 'SPIN MOVE!'])); slowMo(0.3); }
  return true;
}
// where should a Hawk run to meet the ball carrier? (smart pursuit angle)
function interceptPoint(d, c, sp, maxT = 1.6) {
  const rx = c.x - d.x, ry = c.y - d.y, a = c.vx * c.vx + c.vy * c.vy - sp * sp, b = 2 * (rx * c.vx + ry * c.vy), cc = rx * rx + ry * ry;
  let t = maxT;
  if (Math.abs(a) < 1e-6) { if (b < 0) t = -cc / b; }
  else { const disc = b * b - 4 * a * cc; if (disc >= 0) { const s = Math.sqrt(disc), ts = [(-b - s) / (2 * a), (-b + s) / (2 * a)].filter(v => v > 0); if (ts.length) t = Math.min(...ts); } }
  t = clamp(t, 0, maxT) * CONFIG.DEFENDER_SMARTS;
  return { x: c.x + c.vx * t, y: c.y + c.vy * t };
}
function delayed(p, sec) {        // where a receiver WAS a moment ago (man coverage reacts late to cuts)
  const h = p.hist, want = G.simT - sec;
  for (let i = h.length - 1; i >= 0; i--) if (h[i].t <= want) return h[i];
  return h[0] || p;
}

function updateLive(dt) {
  G.playT += dt; G.simT += dt;
  const qb = G.qb, play = PLAYS[G.playIdx], L = G.los;
  G.jukeCd = Math.max(0, G.jukeCd - dt);
  // --- you ---
  if (G.carrier === qb && G.phase === 'pre' && !play.run && G.playT < 0.45) steer(qb, 15, Math.max(L - 5.5, OWN_GOAL + 1.5), 6, dt, 10);   // quick drop back (not into your own end zone)
  else moveControlled(dt);
  if (G.controlled) { const c = G.controlled; c.safeT = Math.max(0, c.safeT - dt); c.jukeT = Math.max(0, c.jukeT - dt); if (c.jukeT > 0) c.spin += dt * 22; }
  if (G.phase === 'pre' && G.carrier === qb) {
    if (play.run) {               // HANDOFF to the running back
      const rb = G.rb;
      if (rb && G.playT > 0.3 && dist(rb, qb) < 1.6) {
        G.carrier = rb; G.controlled = rb; G.phase = 'run'; rb.safeT = 0.2;
        G.defense.forEach(d => d.react = rand(CONFIG.DEFENDER_REACTION[0], CONFIG.DEFENDER_REACTION[1]));
      }
    } else if (CONFIG.QB_CAN_RUN && qb.y > L + 0.2) {   // QB runs past the line (Rookie only)
      G.phase = 'run'; G.openReceiver = null; G.aim = null;
      G.defense.forEach(d => d.react = rand(CONFIG.DEFENDER_REACTION[0] * 0.75, CONFIG.DEFENDER_REACTION[1] * 0.9));
    } else if (G.playT > CONFIG.QB_CLOCK) return endPlay('clock', L);
  }

  // --- teammates ---
  G.offense.forEach(p => {
    if (p === G.controlled && !(p === qb && G.playT < 0.45 && G.phase === 'pre')) return;
    if (p === qb) {
      if (G.phase === 'pre' && play.run) steer(p, 14, Math.max(L - 4.5, OWN_GOAL + 1), 3, dt);
      else if (G.phase !== 'pre') steer(p, p.x, p.y, 0, dt, 4);
      return;
    }
    if (p === G.rb && G.phase === 'pre') { steer(p, qb.x, qb.y, CONFIG.TEAMMATE_SPEED * 0.8, dt, 8); return; }
    if (G.phase === 'pre' || (G.phase === 'air' && G.ball.target !== p)) {
      const wp = p.route[p.routeI];
      if (wp) { steer(p, wp.x, wp.y, CONFIG.TEAMMATE_SPEED, dt); if (Math.hypot(wp.x - p.x, wp.y - p.y) < 0.6) p.routeI++; }
      else steer(p, p.x, p.y, 0, dt, 5);
    } else if (G.phase === 'air') {            // run to where the ball is going
      steer(p, G.ball.tx, G.ball.ty, CONFIG.TEAMMATE_SPEED * 1.15, dt, 12);
    } else if (G.carrier) {                    // jog along with the ball carrier
      const side = p.x < G.carrier.x ? -1 : 1;
      steer(p, clamp(G.carrier.x + side * 5, 1, FW - 1), G.carrier.y + 2, CONFIG.TEAMMATE_SPEED * 0.85, dt, 4);
    }
  });

  // --- Hawks defenders ---
  const c0 = G.carrier;
  const chasers = c0 && G.phase === 'run' ? G.defense.slice().sort((a, b) => dist(a, c0) - dist(b, c0)) : [];
  G.defense.forEach(d => {
    // short sprint bursts when close to the ball carrier (they get tired!)
    let sp = CONFIG.DEFENDER_SPEED * d.skill;
    d.react = Math.max(0, d.react - dt);
    const bursting = d.react <= 0 && c0 && dist(d, c0) < CONFIG.DEFENDER_BURST_RANGE && d.stam > 0;
    if (bursting) { sp = CONFIG.DEFENDER_BURST_SPEED * d.skill; d.stam -= dt / CONFIG.DEFENDER_BURST_TIME; }
    else d.stam = Math.min(1, d.stam + dt * 0.35);
    if (d.react > 0) return;                  // still keep going the old way (or stumbling after a juke)
    if (G.phase === 'pre') {
      if (d.role === 'rush') {
        if (G.playT > CONFIG.RUSHER_DELAY) { const t = interceptPoint(d, qb, sp, 0.6); chase(d, t.x, t.y, sp, dt); }
        else steer(d, d.x, d.y, 0, dt);
      } else if (d.role === 'cover' && d.cover) {
        const r = d.cover, h = delayed(r, CONFIG.COVER_DELAY), k = CONFIG.COVER_DELAY;
        if (r === G.rb) steer(d, lerp(15, r.x, 0.5), L + 4, sp * 0.8, dt, 5);   // watch the running back
        else if (r === G.offense[1] && CONFIG.ROBBER_DEPTH > 0) {                // "robber": deep over the middle, shading to the deepest threat
          let deep = r; G.offense.forEach(p => { if (p !== qb && p.role !== 'rb' && p.y > deep.y) deep = p; });
          steer(d, lerp(h.x, deep.x, 0.35), Math.max(h.y + CONFIG.ROBBER_DEPTH, L + 4), sp * 0.9, dt, 6);
        }
        else steer(d, h.x + h.vx * k, h.y + h.vy * k + CONFIG.COVER_CUSHION, sp * CONFIG.COVERAGE_SPEED, dt, 9);
      } else {                                 // deep safety: stays deep and shades toward your deepest receiver
        let deep = null; G.offense.forEach(p => { if (p !== qb && p.role !== 'rb' && (!deep || p.y > deep.y)) deep = p; });
        const tx = deep ? lerp(15, deep.x, 0.55) : 15, ty = Math.max(L + 9, (deep ? deep.y : L) + 5);
        steer(d, tx, Math.min(ty, FL - 1), sp * 0.85, dt, 5);
      }
    } else if (G.phase === 'air') {
      const b = G.ball, near = Math.hypot(d.x - b.tx, d.y - b.ty) < 9;
      if (near || !b.target) steer(d, b.tx, b.ty, sp, dt);
      else steer(d, b.target.x, b.target.y + 1, sp, dt);
    } else if (c0) {
      // the closest Hawk takes the best angle; the others run IN FRONT of you to cut you off
      const rank = chasers.indexOf(d), t = interceptPoint(d, c0, sp);
      let tx = t.x, ty = t.y;
      if (rank > 0 && d.y > c0.y - 1) {
        ty += CONFIG.CUTOFF_AHEAD;
        if (c0.x < 8 || c0.x > FW - 8) tx = lerp(tx, c0.x < 15 ? 0.5 : FW - 0.5, 0.35);   // seal the sideline
      }
      chase(d, tx, ty, sp, dt, 8);
    }
  });
  separate(G.defense);
  G.offense.forEach(p => move(p, dt)); G.defense.forEach(d => move(d, dt));
  G.offense.forEach(p => { p.hist.push({ t: G.simT, x: p.x, y: p.y, vx: p.vx, vy: p.vy }); if (p.hist.length > 90) p.hist.shift(); });

  // --- ball in the air ---
  if (G.phase === 'air') {
    const b = G.ball; b.t += dt / b.dur;
    if (b.t >= 1) return resolvePass();
  }
  G.openReceiver = null;
  if (canThrow() && CONFIG.SHOW_OPEN_HINT && G.playT > 0.3) {   // gold ring only when a buddy is really open
    const r = findOpenReceiver(); if (r && G.defense.every(d => dist(d, r) >= CONFIG.OPEN_HINT_SEP)) G.openReceiver = r;
  }

  // --- did something end the play? ---
  const c = G.carrier;
  if (c && G.state === 'live') {
    if (c.y >= OPP_GOAL && c.x >= 0 && c.x <= FW) return touchdown();
    if (c.x < 0 || c.x > FW) return endPlay('out', c.y);
    if (c.safeT <= 0) for (const d of G.defense) if (dist(d, c) < CONFIG.FLAG_PULL_REACH) {
      pullFlag(c, d); return endPlay(c === qb && G.phase === 'pre' ? 'sack' : 'flag', c.y);
    }
    if (G.phase === 'run' && !G.breakaway && c.y > L + 6 && OPP_GOAL - c.y > 8 && G.defense.every(d => d.y < c.y - 1.5 || dist(d, c) > 9)) {
      G.breakaway = true; announce(pick(['HE COULD GO ALL THE WAY!', 'NOBODY CAN CATCH HIM!', 'LOOK AT HIM GO!']));
    }
  }
}

function resolvePass() {
  const b = G.ball, r = b.target, land = { x: b.tx, y: b.ty };
  let nd = null, ndd = 1e9; G.defense.forEach(d => { const dd = dist(d, land); if (dd < ndd) { ndd = dd; nd = d; } });
  const rd = r ? dist(r, land) : 1e9, inb = b.tx >= 0 && b.tx <= FW && b.ty <= FL;
  // a Hawk gets there first
  if (nd && ndd < 1.1 && ndd < rd) return endPlay(Math.random() < Math.min(0.9, CONFIG.INTERCEPTION_CHANCE * 1.4) ? 'int' : 'blocked', b.ty);
  if (!r || rd > CONFIG.CATCH_RADIUS || !inb) return endPlay('incomplete', b.ty);
  // contested catch: the closer the Hawk, the more likely he knocks it away
  if (nd && ndd < CONFIG.CONTESTED_RADIUS) {
    const pressure = 1 - ndd / CONFIG.CONTESTED_RADIUS;
    if (Math.random() < pressure * CONFIG.BREAKUP_CHANCE) return endPlay(Math.random() < CONFIG.INTERCEPTION_CHANCE ? 'int' : 'blocked', b.ty);
  }
  G.carrier = r; G.controlled = r; G.phase = 'run'; r.safeT = 0.35; G.ball = null;
  G.defense.forEach(d => d.react = rand(CONFIG.DEFENDER_REACTION[0], CONFIG.DEFENDER_REACTION[1]));
  Sound.catch();
  if (r.y - G.los > 11) { announce(pick(['WHAT A CATCH!', 'HE HAULS IT IN!', 'BIG PLAY!', 'WHAT A THROW!'])); slowMo(0.45); }
  else showMsg('CATCH!', null, '#ffd000', 0.8);
}

function touchdown() {
  G.score.me += CONFIG.TOUCHDOWN_POINTS;
  const s = loadStats(); s.tds = (s.tds || 0) + 1; saveStats(s);
  slowMo(0.9);
  celebrate('TOUCHDOWN!', '+' + CONFIG.TOUCHDOWN_POINTS + ' for ' + CONFIG.MY_TEAM.name, 'def');
  announce(pick(['TOUCHDOWN!', 'HE IS GONE! TOUCHDOWN!', 'SIX POINTS!', 'TAKE A BOW!']));
}

function endPlay(reason, spotY) {
  G.state = 'dead'; G.stateT = 0; G.ball = null; G.openReceiver = null; G.controlled = null; G.aim = null; G.turboOn = false;
  Sound.whistle();
  const opp = CONFIG.OPP_TEAM.name, gain = Math.round(spotY - G.los);
  const yardsTxt = gain > 0 ? `Gain of ${gain} yard${gain === 1 ? '' : 's'}` : gain < 0 ? `Loss of ${-gain}` : 'No gain';
  G.nextAction = 'down';
  if ((reason === 'flag' || reason === 'out' || reason === 'sack') && spotY < OWN_GOAL) {
    G.score.opp += 2; showMsg('SAFETY!', `${opp} get 2 points`, '#ff8a80', 2); Sound.sad(); G.nextAction = 'turnover'; return;
  }
  if (reason === 'int') { showMsg('INTERCEPTED!', `${opp} take the ball`, '#ff8a80', 2); Sound.sad(); G.nextAction = 'turnover'; announce('PICKED OFF!'); return; }
  if (reason === 'clock') { G.down++; showMsg('7-SECOND CLOCK!', 'Throw it faster! Lose a down', '#ffb3b3', 1.6); }
  else if (reason === 'incomplete' || reason === 'blocked') { G.down++; showMsg(reason === 'blocked' ? 'KNOCKED DOWN!' : 'INCOMPLETE', 'Try again!', '#ffffff', 1.5); }
  else {
    G.los = clamp(spotY, OWN_GOAL + 0.5, OPP_GOAL - 0.5);
    const big = reason === 'out' ? 'OUT OF BOUNDS' : reason === 'sack' ? 'SACKED!' : 'FLAG PULLED!';
    if (!G.gotFirstDown && G.los >= MIDFIELD) { G.gotFirstDown = true; G.down = 1; showMsg('FIRST DOWN!', yardsTxt + ' - now go score!', '#ffd000', 1.8); setTimeout(() => Sound.firstDown(), 350); announce('MOVE THE CHAINS!'); return; }
    G.down++; showMsg(big, yardsTxt, gain > 0 ? '#ffffff' : '#ffb3b3', 1.6);
  }
  if (G.down > CONFIG.DOWNS) { G.nextAction = 'turnover'; G.msg.small = `Out of downs - ${opp} ball`; Sound.sad(); }
}

/* ---------------- DEFENSE (the Hawks have the ball) ---------------- */
function switchDefender(target) {   // SPACE / SWITCH button / tap a defender
  if (G.side !== 'def' || !(G.state === 'live' || G.state === 'presnap')) return;
  let p = target;
  if (!p) {
    const ball = G.carrier || (G.ball ? { x: lerp(G.ball.fx, G.ball.tx, 0.7), y: lerp(G.ball.fy, G.ball.ty, 0.7) } : G.qb);
    let best = 1e9; G.defense.forEach(d => { const dd = dist(d, ball); if (dd < best) { best = dd; p = d; } });
  }
  if (p && p !== G.controlled) { G.controlled = p; p.react = 0; Sound.click(); }
}
function reactSilver() { G.defense.forEach(d => d.react = rand(CONFIG.MY_DEFENDER_REACTION[0], CONFIG.MY_DEFENDER_REACTION[1])); }

function hawksOpenReceiver() {
  let best = null;
  G.offense.forEach(p => {
    if (p === G.qb) return;
    let near = 1e9; G.defense.forEach(d => near = Math.min(near, dist(p, d)));
    const score = Math.min(near, 8) + (G.qb.y - p.y) * 0.06;
    if (!best || score > best.score) best = { p, score, open: near };
  });
  return best;
}

// the Hawks ball carrier runs for your end zone and tries to dodge you
function runnerAI(c, dt) {
  let dx = 0, dy = -1, nd = null, ndd = 1e9;
  G.defense.forEach(d => {
    const ox = c.x - d.x, oy = c.y - d.y, dd = Math.hypot(ox, oy) || 0.01;
    if (dd < ndd) { ndd = dd; nd = d; }
    if (dd < 7 && d.y < c.y + 2) { const w = (7 - dd) / 7; dx += ox / dd * w * 1.5; dy += oy / dd * w * 0.4; }
  });
  if (c.x < 3) dx += (3 - c.x) * 0.6;
  if (c.x > FW - 3) dx -= (c.x - (FW - 3)) * 0.6;
  c.jukeCd -= dt; c.jukeT -= dt;
  if (nd && ndd < 3 && c.jukeCd <= 0) {          // JUKE! a quick cut when you get close
    c.jukeCd = 1.1;
    if (Math.random() < CONFIG.HAWKS_JUKE) {
      c.jukeT = 0.3; c.jukeDir = (c.x >= nd.x ? 1 : -1) * (Math.random() < 0.25 ? -1 : 1);
      if (c.x < 4) c.jukeDir = 1; if (c.x > FW - 4) c.jukeDir = -1;
    }
  }
  if (c.jukeT > 0) dx += c.jukeDir * 3;
  dy = Math.min(dy, -0.35);                       // always keep heading for the end zone
  const m = Math.hypot(dx, dy);
  steer(c, c.x + dx / m * 5, c.y + dy / m * 5, CONFIG.HAWKS_RUNNER_SPEED, dt, c.jukeT > 0 ? 16 : 8);
}

function updateDefLive(dt) {
  G.playT += dt;
  const qb = G.qb, L = G.los;
  moveControlled(dt);

  // --- the Hawks' play: pass or run ---
  if (G.phase === 'pre' && G.carrier === qb) {
    if (G.playType === 'run') {
      if (G.playT > 0.5 && dist(G.rb, qb) < 1.6) { G.carrier = G.rb; G.phase = 'run'; reactSilver(); }   // handoff
    } else {
      const pressured = G.defense.some(d => dist(d, qb) < 2.6);
      if (G.playT > G.throwAt || (pressured && G.playT > 0.5)) {
        const best = hawksOpenReceiver();
        if (best && (best.open > 1.8 || G.playT > G.throwAt + 1.0)) { launchBall(qb, best.p, CONFIG.BALL_SPEED); G.defense.forEach(d => d.react = rand(0.05, 0.25)); }
        else if (pressured || G.playT > G.throwAt + 1.6) { G.phase = 'run'; reactSilver(); }   // QB scrambles!
      }
    }
    if (G.phase === 'pre' && qb.y < L - 0.2) { G.phase = 'run'; reactSilver(); }
  }

  // --- Hawks players ---
  G.offense.forEach(p => {
    if (p === G.carrier && G.phase === 'run') { runnerAI(p, dt); return; }
    if (p === qb) { if (G.phase === 'pre') steer(p, 15, L + 5.5, 3, dt, 6); else steer(p, p.x, p.y, 0, dt, 4); return; }
    if (p === G.rb && G.playType === 'run' && G.phase === 'pre') { steer(p, qb.x, qb.y, CONFIG.HAWKS_RECEIVER_SPEED * 0.8, dt, 8); return; }
    if (G.phase === 'air' && G.ball.target === p) { steer(p, G.ball.tx, G.ball.ty, CONFIG.HAWKS_RECEIVER_SPEED * 1.15, dt, 12); return; }
    if (G.phase === 'pre' || G.phase === 'air') {
      const wp = p.route[p.routeI];
      if (wp) { steer(p, wp.x, wp.y, CONFIG.HAWKS_RECEIVER_SPEED, dt); if (Math.hypot(wp.x - p.x, wp.y - p.y) < 0.6) p.routeI++; }
      else steer(p, p.x, p.y, 0, dt, 5);
    } else if (G.carrier) {
      const side = p.x < G.carrier.x ? -1 : 1;
      steer(p, clamp(G.carrier.x + side * 5, 1, FW - 1), G.carrier.y - 2, CONFIG.HAWKS_RECEIVER_SPEED * 0.8, dt, 4);
    }
  });

  // --- your computer teammates on defense (a bit slower, so YOUR player matters) ---
  G.defense.forEach(d => {
    if (d === G.controlled) return;
    const sp = CONFIG.MY_AI_DEFENDER_SPEED * d.skill;
    d.react = Math.max(0, d.react - dt);
    if (d.react > 0) return;
    if (G.phase === 'pre') {
      if (d.cover) { const r = d.cover; steer(d, r.x - r.vx * 0.35, r.y - 1.6 - r.vy * 0.35, sp * 0.93, dt, 6); }
      else if (G.playT > CONFIG.MY_AI_RUSHER_DELAY) steer(d, qb.x, qb.y, sp * 0.9, dt);
      else steer(d, d.x, d.y, 0, dt);
    } else if (G.phase === 'air') steer(d, G.ball.tx, G.ball.ty, sp, dt);
    else if (G.carrier) {
      const c = G.carrier, lead = clamp(dist(d, c) / sp, 0, 1) * CONFIG.DEFENDER_SMARTS * 0.8;
      steer(d, c.x + c.vx * lead, c.y + c.vy * lead, sp, dt, 7);
    }
  });
  separate(G.defense);
  G.offense.forEach(p => move(p, dt)); G.defense.forEach(d => move(d, dt));

  // --- ball in the air: can YOU pick it off? ---
  if (G.phase === 'air') {
    const b = G.ball; b.t += dt / b.dur;
    const bt = Math.min(1, b.t), bx = lerp(b.fx, b.tx, bt), by = lerp(b.fy, b.ty, bt), h = Math.sin(Math.PI * bt) * b.peak;
    const cd = G.controlled;
    if (cd && !b.tried && bt > 0.25 && h < 1.8 && Math.hypot(cd.x - bx, cd.y - by) < CONFIG.INTERCEPT_REACH) {
      b.tried = true;
      return endDefPlay(Math.random() < CONFIG.PLAYER_INT_CHANCE ? 'int' : 'blocked', by);
    }
    if (b.t >= 1) return resolveHawksPass();
  }

  // --- did the play end? ---
  const c = G.carrier;
  if (c && G.state === 'live') {
    c.safeT = Math.max(0, c.safeT - dt);
    if (c.y <= OWN_GOAL && c.x >= 0 && c.x <= FW) return hawksTouchdown();
    if (c.x < 0 || c.x > FW) return endDefPlay('out', c.y);
    if (c.safeT <= 0) for (const d of G.defense) if (dist(d, c) < CONFIG.FLAG_PULL_REACH) {
      pullFlag(c, d); return endDefPlay(c === qb && G.phase === 'pre' ? 'sack' : 'flag', c.y);
    }
  }
}

function resolveHawksPass() {
  const b = G.ball, r = b.target, land = { x: b.tx, y: b.ty };
  let nd = null, ndd = 1e9; G.defense.forEach(d => { const dd = dist(d, land); if (dd < ndd) { ndd = dd; nd = d; } });
  const rd = dist(r, land);
  if (nd && ndd < CONFIG.FLAG_PULL_REACH + 0.5 && ndd < rd) {
    const chance = nd === G.controlled ? CONFIG.PLAYER_INT_CHANCE : CONFIG.AI_INT_CHANCE;
    return endDefPlay(Math.random() < chance ? 'int' : 'blocked', b.ty);
  }
  if (rd <= 1.8 && b.tx >= 0 && b.tx <= FW) {
    G.carrier = r; G.phase = 'run'; r.safeT = 0.35; G.ball = null; reactSilver();
    Sound.catch(); showMsg('THEY CAUGHT IT!', 'Go get that flag!', '#ffffff', 1.0);
    return;
  }
  endDefPlay('incomplete', b.ty);
}

function hawksTouchdown() {
  G.state = 'dead'; G.stateT = 0; G.ball = null; G.nextAction = 'toOffense';
  G.score.opp += CONFIG.TOUCHDOWN_POINTS;
  Sound.whistle(); Sound.sad();
  showMsg(`${CONFIG.OPP_TEAM.name} SCORE`, `+${CONFIG.TOUCHDOWN_POINTS} for them - your ball next!`, '#ff8a80', 2.4);
}

function endDefPlay(reason, spotY) {
  G.state = 'dead'; G.stateT = 0; G.ball = null; G.nextAction = 'down';
  Sound.whistle();
  const opp = CONFIG.OPP_TEAM.name, gain = Math.round(G.los - spotY);
  if ((reason === 'flag' || reason === 'out' || reason === 'sack') && spotY > OPP_GOAL) {
    G.score.me += 2; return celebrate('SAFETY!', '+2 for ' + CONFIG.MY_TEAM.name, 'off');
  }
  if (reason === 'int') { slowMo(0.6); celebrate('INTERCEPTION!', 'You picked it off!', 'off'); announce('PICKED OFF!'); return; }
  if (reason === 'incomplete' || reason === 'blocked') {
    G.down++; showMsg(reason === 'blocked' ? 'KNOCKED DOWN!' : 'INCOMPLETE', 'Great defense!', '#ffffff', 1.5);
  } else {
    G.los = clamp(spotY, OWN_GOAL + 0.5, OPP_GOAL - 0.5);
    const big = reason === 'out' ? 'OUT OF BOUNDS' : reason === 'sack' ? 'SACK!' : 'FLAG PULLED!';
    const txt = gain > 0 ? `They gained ${gain}` : gain < 0 ? `They lost ${-gain} yards!` : 'No gain!';
    if (!G.gotFirstDown && G.los <= MIDFIELD) { G.gotFirstDown = true; G.down = 1; showMsg(big, `${opp} first down - stop them!`, '#ffffff', 1.8); return; }
    G.down++; showMsg(big, txt, gain > 0 ? '#ffffff' : '#ffd000', 1.6);
  }
  if (G.down > 4) { celebrate('DEFENSE WINS!', `You stopped the ${opp}!`, 'off'); announce('WHAT A STOP!'); }
}

/* ---------------- main update ---------------- */
function update(dt) {
  const realDt = dt;
  if (G.slowmo > 0) { G.slowmo -= realDt; dt *= CONFIG.SLOW_MOTION; }   // big play = slow motion!
  G.stateT += dt;
  if (G.msg) { G.msg.t += dt; if (G.msg.t > G.msg.dur) G.msg = null; }
  if (G.callout) { G.callout.t += realDt; if (G.callout.t > G.callout.dur) G.callout = null; }
  updateConfetti(realDt); updateFlyingFlags(dt);
  if (G.state === 'playcall' || G.state === 'presnap') {
    // everyone stands still on the line, then HIKE!
    [...G.offense, ...G.defense].forEach(p => { p.vx *= 0.8; p.vy *= 0.8; });
    if (G.state === 'presnap' && G.stateT > G.presnapTime) {
      G.state = 'live'; G.stateT = 0; makeRoutes(G.side === 'def' ? -1 : 1); Sound.hike();
      if (G.side === 'off' && PLAYS[G.playIdx].run) G.controlled = null;   // the QB hands off by himself
    }
  } else if (G.state === 'live') {
    if (G.side === 'off') updateLive(dt); else updateDefLive(dt);
  } else if (G.state === 'dead' || G.state === 'td') {
    [...G.offense, ...G.defense].forEach(p => { steer(p, p.x, p.y, 0, dt, 3); move(p, dt); });
    if (G.state === 'td') {                       // celebrate! (your team jumps)
      [...G.offense, ...G.defense].forEach((p, i) => { if (p.team === 'me') { p.z = Math.abs(Math.sin(G.stateT * 7 + i)) * 0.6; p.anim += dt * 8; } });
      if (G.stateT < 2.6 && Math.random() < 0.5) spawnConfetti();
      if (G.stateT > 3.4) {
        [...G.offense, ...G.defense].forEach(p => p.z = 0);
        if (G.afterCelebrate === 'def') startOppDrive(); else driveOverGoOffense();
      }
    } else if (G.stateT > (G.nextAction === 'toOffense' ? 2.6 : 1.8)) {
      if (G.nextAction === 'turnover') startOppDrive();
      else if (G.nextAction === 'toOffense') driveOverGoOffense();
      else if (G.side === 'off') setupPlay(); else setupDefPlay();
    }
  } else if (G.state === 'title' || G.state === 'over') {
    cam.y = 35 + Math.sin(performance.now() / 4000) * 12;
  }
  updateCamera(realDt);
}

function updateCamera(dt) {
  if (G.state === 'title' || G.state === 'over') { cam.x = 15; clampCam(); return; }
  const dir = G.side === 'def' ? -1 : 1;
  let fx = 15, fy = G.los + dir * 6;
  if (G.ball) { const b = G.ball; fx = lerp(b.fx, b.tx, Math.min(1, b.t)); fy = lerp(b.fy, b.ty, Math.min(1, b.t)); }
  else if (G.carrier) { fx = G.carrier.x; fy = G.carrier.y + dir * visAlong() * (G.phase === 'pre' ? 0.18 : 0.12); }
  if (G.side === 'def' && G.controlled && G.carrier) {   // keep your defender in view too
    fx = lerp(fx, G.controlled.x, 0.3); fy = lerp(fy, G.controlled.y, 0.3);
  }
  if (G.aim && G.carrier) { fy = lerp(fy, G.aim.y, 0.25); }   // peek downfield while aiming
  if (G.state === 'presnap') fy = G.los + dir * visAlong() * 0.24;
  if (G.state === 'playcall') { fx = 15; fy = G.los + visAlong() * (LAND ? 0.22 : -0.06); }   // room for the play cards
  const k = 1 - Math.exp(-dt * 4);
  cam.x += (fx - cam.x) * k; cam.y += (fy - cam.y) * k;
  clampCam();
}
function clampCam() {
  const ha = visAcross() / 2, hl = visAlong() / 2;
  const x0 = -8 + ha, x1 = 38 - ha; cam.x = x0 > x1 ? 15 : clamp(cam.x, x0, x1);
  const y0 = WORLD.minY + hl, y1 = WORLD.maxY - hl; cam.y = y0 > y1 ? 35 : clamp(cam.y, y0, y1);
}

/* ---------- confetti & flying flags ---------- */
function spawnConfetti() {
  const cols = [CONFIG.MY_TEAM.jersey, CONFIG.MY_TEAM.accent, CONFIG.MY_TEAM.flags, '#ffffff', '#ffd000', '#ff4081'];
  G.confetti.push({ x: rand(0, W), y: rand(-H * 0.3, -10), vx: rand(-40, 40), vy: rand(80, 220), r: rand(0, 6), vr: rand(-8, 8),
                    w: rand(6, 11), h: rand(3, 6), c: pick(cols), life: 4 });
}
function updateConfetti(dt) {
  G.confetti.forEach(p => { p.x += p.vx * dt + Math.sin(p.r) * 0.6; p.y += p.vy * dt; p.r += p.vr * dt; p.life -= dt; });
  G.confetti = G.confetti.filter(p => p.life > 0 && p.y < H + 20);
}
function updateFlyingFlags(dt) {
  G.flyingFlags.forEach(f => { f.t += dt; f.z += f.vz * dt; f.vz -= 16 * dt; if (f.z < 0) { f.z = 0; f.vz = 0; f.vr = 0; } f.rot += f.vr * dt; f.life -= dt; });
  G.flyingFlags = G.flyingFlags.filter(f => f.life > 0);
}

/* ==========================================================================
   11) DRAWING THE SCREEN
   ========================================================================== */
const UI_DARK = '#1b1e24';   // scoreboard / panels (dark charcoal so BLUE always means the Hawks)
const GOLD = '#ffd000';

function drawWorld() {
  drawBackground(); drawField();
  if (G.state === 'title') return;          // clean field behind the title screen
  drawPlayLines();
  const all = [...G.offense, ...G.defense].map(p => ({ p, sy: w2s(p.x, p.y)[1] }));
  all.sort((a, b) => a.sy - b.sy).forEach(o => drawPlayer(o.p));
  drawAim();
  if (G.ball) {                                  // ball flying through the air
    const b = G.ball, bt = Math.min(1, b.t), x = lerp(b.fx, b.tx, bt), y = lerp(b.fy, b.ty, bt), h = Math.sin(Math.PI * bt) * b.peak;
    const [sx, sy] = w2s(x, y);
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(sx, sy, 0.3 * S, 0.14 * S, 0, 0, 7); ctx.fill();
    const t2 = w2s(b.tx, b.ty);                // landing spot marker
    ctx.strokeStyle = 'rgba(255,208,0,0.85)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(t2[0], t2[1], 0.6 * S, 0, 7); ctx.stroke();
    const ang = Math.atan2(t2[1] - sy, t2[0] - sx);
    drawBall(sx, sy - (h + 1.0) * S, Math.max(6, 0.36 * S * CONFIG.PLAYER_DRAW_SIZE), ang);
  }
  drawFlyingFlags();
  drawQbClock();
}

function arrowLine(pts, color, width, alpha = 1, dash = null) {   // pts in screen pixels; arrow head at the end
  if (pts.length < 2) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); pts.slice(1).forEach(p => ctx.lineTo(p[0], p[1])); ctx.stroke();
  ctx.setLineDash([]);
  const a = pts[pts.length - 2], b = pts[pts.length - 1], ang = Math.atan2(b[1] - a[1], b[0] - a[0]), hs = width * 2.6;
  ctx.beginPath(); ctx.moveTo(b[0] + Math.cos(ang) * hs * 0.6, b[1] + Math.sin(ang) * hs * 0.6);
  ctx.lineTo(b[0] + Math.cos(ang + 2.5) * hs, b[1] + Math.sin(ang + 2.5) * hs); ctx.lineTo(b[0] + Math.cos(ang - 2.5) * hs, b[1] + Math.sin(ang - 2.5) * hs);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function trimRoute(start, wps, maxLast = 7) {   // don't draw the long "keep running" part all the way down the field
  const pts = [start, ...wps.map(w => ({ x: w.x, y: w.y }))];
  if (pts.length >= 2) {
    const a = pts[pts.length - 2], b = pts[pts.length - 1], d = Math.hypot(b.x - a.x, b.y - a.y);
    if (d > maxLast) pts[pts.length - 1] = { x: a.x + (b.x - a.x) * maxLast / d, y: a.y + (b.y - a.y) * maxLast / d };
  }
  return pts;
}
function drawPlayLines() {            // your play drawn on the field (before & right after the snap)
  if (G.side !== 'off') return;
  let idx, alpha;
  if (G.state === 'playcall') { idx = G.playHover; alpha = 0.95; }
  else if (G.state === 'presnap') { idx = G.playIdx; alpha = 0.8; }
  else if (G.state === 'live' && G.phase === 'pre' && G.playT < 1.2) { idx = G.playIdx; alpha = 0.8 * (1 - G.playT / 1.2); }
  else return;
  const routes = playRoutes(idx), wpx = Math.max(2.5, S * 0.16);
  routes.forEach((wps, p) => {
    if (!wps.length) return;
    arrowLine(trimRoute(p, wps).map(q => w2s(q.x, q.y)), GOLD, wpx, alpha, [wpx * 2.2, wpx * 1.6]);
  });
  if (PLAYS[idx].run) {
    const rb = G.offense[4], qb = G.qb, L = G.los;
    arrowLine([[rb.x, rb.y], [qb.x - 0.6, qb.y + 0.3], [14, L + 3], [13.5, L + 8]].map(q => w2s(q[0], q[1])), '#ff9800', wpx * 1.2, alpha);
  }
}

function drawAim() {                  // drag-to-aim: dotted arc + target
  if (!G.aim || !canThrow()) return;
  const t = aimTarget(G.aim), qb = G.qb, u = S * CONFIG.PLAYER_DRAW_SIZE;
  const [ax, ay0] = w2s(qb.x, qb.y), [bx, by] = w2s(t.x, t.y), ay = ay0 - 1.5 * u;
  const hf = Math.abs(bx - ax) / (Math.hypot(bx - ax, by - ay) || 1), peak = (1.2 + t.d * 0.07) * S * (0.3 + 0.7 * hf);   // flatter arc for straight-up throws
  const col = t.max ? '#ff7043' : GOLD;
  const n = Math.max(10, Math.round(t.d * 1.2));
  for (let i = 1; i < n; i++) {
    const k = i / n, x = lerp(ax, bx, k), y = lerp(ay, by, k) - Math.sin(Math.PI * k) * peak, r = Math.max(2.5, S * 0.13);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.arc(x + 1.5, y + 1.5, r, 0, 7); ctx.fill();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  const pulse = 1 + Math.sin(performance.now() / 120) * 0.08, rr = 0.8 * S * pulse;
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(3, S * 0.14);
  ctx.beginPath(); ctx.arc(bx, by, rr, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx - rr * 1.5, by); ctx.lineTo(bx - rr * 0.5, by); ctx.moveTo(bx + rr * 0.5, by); ctx.lineTo(bx + rr * 1.5, by);
  ctx.moveTo(bx, by - rr * 1.5); ctx.lineTo(bx, by - rr * 0.5); ctx.moveTo(bx, by + rr * 0.5); ctx.lineTo(bx, by + rr * 1.5); ctx.stroke();
  if (t.r) {
    const [rx, ry] = w2s(t.r.x, t.r.y);
    ctx.strokeStyle = GOLD; ctx.lineWidth = Math.max(3, 0.12 * u);
    ctx.beginPath(); ctx.ellipse(rx, ry, 0.75 * u, 0.32 * u, 0, 0, 7); ctx.stroke();
  }
}

function drawQbClock() {              // 7-second rule countdown over the QB
  if (!canThrow()) return;
  const left = CONFIG.QB_CLOCK - G.playT;
  if (left > 3) return;
  const [sx, sy] = w2s(G.qb.x, G.qb.y), u = S * CONFIG.PLAYER_DRAW_SIZE;
  outlinedText(String(Math.max(1, Math.ceil(left))), sx, sy - 2.3 * u, Math.max(20, 0.8 * u), '#ff5252', '#14161b');
}

function drawFlyingFlags() {
  const u = S * CONFIG.PLAYER_DRAW_SIZE;
  G.flyingFlags.forEach(f => {
    const [sx, sy0] = w2s(f.x, f.y), sy = sy0 - (f.z + 1.2) * u;
    if (f.t < 0.35) {                           // little "pop!" burst
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(2, 0.06 * u);
      const r1 = u * (0.3 + f.t * 2), r2 = r1 + u * 0.3;
      for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; ctx.beginPath(); ctx.moveTo(sx + Math.cos(a) * r1, sy0 - u + Math.sin(a) * r1); ctx.lineTo(sx + Math.cos(a) * r2, sy0 - u + Math.sin(a) * r2); ctx.stroke(); }
    }
    ctx.save(); ctx.globalAlpha = clamp(f.life / 0.4, 0, 1); ctx.translate(sx, sy); ctx.rotate(f.rot);
    ctx.fillStyle = f.color; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = Math.max(1, 0.04 * u);
    ctx.fillRect(-0.07 * u, -0.25 * u, 0.14 * u, 0.5 * u); ctx.strokeRect(-0.07 * u, -0.25 * u, 0.14 * u, 0.5 * u);
    ctx.restore();
  });
}

function drawHUD() {
  const pad = 8, pw = Math.min(W - 2 * (58 + Math.max(SAFE.l, SAFE.r)), 600), ph = Math.max(46, Math.min(60, pw * 0.11)), px = (W - pw) / 2, py = pad + SAFE.t;
  const fs = clamp(pw / 26, 10, 20);
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 8;
  ctx.fillStyle = UI_DARK; roundRect(px, py, pw, ph, 12); ctx.fill(); ctx.shadowBlur = 0;
  const sw = pw * 0.39;
  // my team (silver)
  const grad = ctx.createLinearGradient(0, py, 0, py + ph);
  grad.addColorStop(0, '#f2f4f7'); grad.addColorStop(1, '#a9b1bc');
  ctx.fillStyle = grad; roundRect(px + 4, py + 4, sw - 4, ph - 8, 9); ctx.fill();
  ctx.font = font(fs * 0.85); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = CONFIG.MY_TEAM.accent;
  ctx.fillText(CONFIG.MY_TEAM.name, px + 12, py + ph / 2, sw - fs * 2.6);
  ctx.font = font(fs * 1.5); ctx.textAlign = 'right'; ctx.fillText(G.score.me, px + sw - 8, py + ph / 2 + 1);
  // the Hawks (blue)
  ctx.fillStyle = CONFIG.OPP_TEAM.jersey; roundRect(px + pw - sw, py + 4, sw - 4, ph - 8, 9); ctx.fill();
  ctx.font = font(fs * 0.85); ctx.textAlign = 'right'; ctx.fillStyle = '#ffffff';
  ctx.fillText(CONFIG.OPP_TEAM.name, px + pw - 12, py + ph / 2, sw - fs * 2.6);
  ctx.font = font(fs * 1.5); ctx.textAlign = 'left'; ctx.fillText(G.score.opp, px + pw - sw + 8, py + ph / 2 + 1);
  // middle: offense / defense + drive
  ctx.textAlign = 'center'; ctx.fillStyle = GOLD;
  ctx.font = font(fitPx('DEFENSE', fs * 0.62, pw - 2 * sw - 8));
  ctx.fillText(G.side === 'def' ? 'DEFENSE' : 'OFFENSE', W / 2, py + ph * 0.33);
  ctx.fillStyle = '#ffffff'; ctx.font = font(fs * 0.95);
  ctx.fillText(`${Math.min(G.drive, CONFIG.DRIVES_PER_GAME)}/${CONFIG.DRIVES_PER_GAME}`, W / 2, py + ph * 0.68);
  // down & distance pill
  if (['playcall', 'presnap', 'live', 'dead'].includes(G.state)) {
    const ord = ['1st', '2nd', '3rd', '4th'][clamp(G.down, 1, 4) - 1];
    let txt;
    if (G.side === 'off') {
      const toGo = G.gotFirstDown ? 'GOAL' : Math.max(1, Math.ceil(MIDFIELD - G.los));
      const yl = G.los - OWN_GOAL, spot = yl < 25 ? `your ${Math.round(yl)}` : yl > 25 ? `their ${Math.round(50 - yl)}` : 'midfield';
      txt = `${ord} & ${toGo}   ·   Ball on ${spot}`;
    } else {
      const toGo = G.gotFirstDown ? 'GOAL' : Math.max(1, Math.ceil(G.los - MIDFIELD));
      const yl = OPP_GOAL - G.los, spot = yl < 25 ? `their ${Math.round(yl)}` : yl > 25 ? `your ${Math.round(50 - yl)}` : 'midfield';
      txt = `Hawks ball  ·  ${ord} & ${toGo}  ·  on ${spot}`;
    }
    const pfs = fitPx(txt, fs * 0.75, W - 40);
    ctx.font = font(pfs, 700); const tw = ctx.measureText(txt).width + 28, th = Math.max(pfs * 1.6, 20);
    ctx.fillStyle = G.side === 'def' ? 'rgba(18,63,158,0.9)' : 'rgba(27,30,36,0.85)';
    roundRect(W / 2 - tw / 2, py + ph + 6, tw, th, th / 2); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.fillText(txt, W / 2, py + ph + 6 + th / 2 + 1);
  }
  ctx.restore();
  drawMuteButton();
}

function drawMuteButton() {
  const m = muteBtn();
  ctx.fillStyle = 'rgba(27,30,36,0.85)'; ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.beginPath();
  ctx.moveTo(m.x - 9, m.y - 4); ctx.lineTo(m.x - 4, m.y - 4); ctx.lineTo(m.x + 2, m.y - 9); ctx.lineTo(m.x + 2, m.y + 9);
  ctx.lineTo(m.x - 4, m.y + 4); ctx.lineTo(m.x - 9, m.y + 4); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
  if (Sound.muted) { ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(m.x + 5, m.y - 6); ctx.lineTo(m.x + 12, m.y + 6); ctx.moveTo(m.x + 12, m.y - 6); ctx.lineTo(m.x + 5, m.y + 6); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(m.x + 3, m.y, 5, -0.9, 0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(m.x + 3, m.y, 9, -0.9, 0.9); ctx.stroke(); }
}

// ---- the 4 play cards (Tecmo-style playbook) ----
function drawPlayCall() {
  ui.cards = [];
  if (G.state !== 'playcall') return;
  const cols = (LAND || W > 640) ? 4 : 2, rows = 4 / cols, pad = 10;
  const availW = W - SAFE.l - SAFE.r - 24;
  const cw = Math.min(cols === 4 ? 190 : 230, (availW - pad * (cols - 1)) / cols);
  const ch = cols === 4 ? Math.min(cw * 0.95, H * 0.33) : Math.min(cw * 0.66, H * 0.14);
  const tw = cols * cw + (cols - 1) * pad, x0 = (W - tw) / 2 + (SAFE.l - SAFE.r) / 2;
  const y0 = H - SAFE.b - 14 - rows * ch - (rows - 1) * pad;
  const hpx = clamp(Math.min(W, H) * 0.05, 16, 26);
  outlinedText(touch.isTouchDevice ? 'PICK A PLAY!' : 'PICK A PLAY!  (1-4 or click)', W / 2, y0 - hpx * 0.9, fitPx('PICK A PLAY!  (1-4 or click)', hpx, W * 0.9), GOLD);
  PLAYS.forEach((pl, i) => {
    const x = x0 + (i % cols) * (cw + pad), y = y0 + Math.floor(i / cols) * (ch + pad), ok = playAllowed(i), hov = i === G.playHover;
    ui.cards[i] = { x, y, w: cw, h: ch };
    ctx.save(); ctx.globalAlpha = ok ? 1 : 0.55;
    ctx.fillStyle = 'rgba(27,30,36,0.93)'; roundRect(x, y, cw, ch, 12); ctx.fill();
    ctx.strokeStyle = hov && ok ? GOLD : 'rgba(255,255,255,0.35)'; ctx.lineWidth = hov && ok ? 4 : 2; ctx.stroke();
    const npx = fitPx(pl.name, Math.min(ch * 0.16, 22), cw - (touch.isTouchDevice ? 14 : 40));
    outlinedText(pl.name, x + cw / 2 + (touch.isTouchDevice ? 0 : 10), y + npx * 0.9 + 4, npx, hov && ok ? GOLD : '#ffffff', '#0b0c0f');
    if (!touch.isTouchDevice) {                 // key number
      ctx.fillStyle = hov && ok ? GOLD : '#ffffff'; ctx.beginPath(); ctx.arc(x + 15, y + npx * 0.9 + 4, 10, 0, 7); ctx.fill();
      ctx.fillStyle = '#14161b'; ctx.font = font(13); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(i + 1), x + 15, y + npx * 0.9 + 5);
    }
    // little chalkboard of the play (downfield = up)
    const dx = x + 8, dy = y + npx * 1.8 + 6, dw = cw - 16, dh = ch - (dy - y) - 8;
    ctx.fillStyle = '#2e7d32'; roundRect(dx, dy, dw, dh, 7); ctx.fill();
    ctx.save(); roundRect(dx, dy, dw, dh, 7); ctx.clip();
    const M = (fx, fy) => [dx + (fx / FW) * dw, dy + dh * 0.78 - (fy / 22) * dh];   // fy = yards past the ball (-5..+17)
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(dx, M(0, 0)[1]); ctx.lineTo(dx + dw, M(0, 0)[1]); ctx.stroke();
    const spots = { qb: [15, -4], c: [15, -0.4], wl: [5.5, -0.6], wr: [24.5, -0.6], sl: pl.run ? [12.5, -4.2] : [20, -1.6] };
    const lw = Math.max(2, dw / 55);
    Object.entries(pl.routes).forEach(([role, r]) => {
      if (!r.length) return;
      const s = spots[role], pts = trimRoute({ x: s[0], y: s[1] }, r.map(([a, b]) => ({ x: clamp(s[0] + a, 1.5, FW - 1.5), y: b })), 6);
      arrowLine(pts.map(q => M(q.x, q.y)), GOLD, lw);
    });
    if (pl.run) arrowLine([M(12.5, -4.2), M(14.4, -3.8), M(14, 3), M(13.5, 9)], '#ff9800', lw * 1.3);
    Object.values(spots).forEach(s => { const [px, py] = M(s[0], s[1]); ctx.fillStyle = '#e6e9ee'; ctx.strokeStyle = '#14161b'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(px, py, Math.max(3.5, dw / 30), 0, 7); ctx.fill(); ctx.stroke(); });
    ctx.restore();
    if (!ok) { ctx.globalAlpha = 1; outlinedText('NO-RUN ZONE', x + cw / 2, y + ch * 0.62, fitPx('NO-RUN ZONE', 16, cw - 12), '#ffb3b3', '#0b0c0f'); }
    ctx.restore();
  });
}

function drawTouchControls() {
  if (!touch.isTouchDevice || !['presnap', 'live'].includes(G.state)) return;
  const def = G.side === 'def', runner = !def && G.phase === 'run' && G.controlled === G.carrier && G.carrier;
  if (touch.joyId !== null) {
    const turbo = runner && G.turboOn;
    ctx.fillStyle = turbo ? 'rgba(255,152,0,0.25)' : 'rgba(255,255,255,0.18)'; ctx.strokeStyle = turbo ? '#ff9800' : 'rgba(255,255,255,0.6)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(touch.baseX, touch.baseY, JOY_R, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = turbo ? '#ff9800' : 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.arc(touch.knobX, touch.knobY, 24, 0, 7); ctx.fill();
    if (turbo) outlinedText('TURBO!', touch.baseX, touch.baseY - JOY_R - 16, 16, '#ff9800');
  } else {
    let hint = null;
    if (def) { if (G.state === 'presnap' || G.playT < 2.5) hint = 'drag to chase · tap a player to switch'; }
    else if (G.state === 'presnap' || canThrow()) hint = PLAYS[G.playIdx].run ? 'handoff! then drag to run' : 'drag to aim · let go to throw';
    else if (runner) hint = 'drag to run · push far = TURBO';
    if (hint && !G.aim) outlinedText(hint, W * 0.38, H - 40 - SAFE.b, fitPx(hint, 15, W * 0.64), '#ffffff');
  }
  const b = passBtn();
  let label = 'PASS', col = '#ff9800', dark = '#e07b00', enabled = canThrow();
  if (def) { label = 'SWITCH'; col = '#33c24a'; dark = '#2a9d3a'; enabled = true; }
  else if (runner) { label = 'JUKE'; col = '#a24bd6'; dark = '#7d2fb0'; enabled = G.stamina >= CONFIG.JUKE_COST && G.jukeCd <= 0; }
  ctx.globalAlpha = enabled ? 1 : 0.35;
  ctx.fillStyle = touch.passPressed ? dark : col;
  ctx.strokeStyle = '#2b1a00'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); ctx.stroke();
  outlinedText(label, b.x, b.y + 1, fitPx(label, b.r * 0.5, b.r * 1.6), '#ffffff', '#2b1a00');
  ctx.globalAlpha = 1;
}

function drawMessage() {
  if (G.state === 'presnap') {
    const t = G.stateT - (G.presnapTime - 1.4);
    if (t > 0) {
      const word = t < 0.55 ? 'READY...' : t < 1.1 ? 'SET...' : 'HIKE!';
      outlinedText(word, W / 2, H * 0.58, Math.min(W, H) * 0.085, '#ffffff');
    }
  }
  if (!G.msg) return;
  const m = G.msg, pop = Math.min(1, m.t / 0.18), wob = G.state === 'td' ? Math.sin(m.t * 10) * 0.06 : 0;
  const fade = m.t > m.dur - 0.25 ? (m.dur - m.t) / 0.25 : 1;
  const bigPx = fitPx(m.big, Math.min(W * 0.11, H * 0.13, 90), W * 0.94);
  ctx.save(); ctx.globalAlpha = clamp(fade, 0, 1);
  ctx.translate(W / 2, H * 0.3); ctx.scale(0.5 + 0.5 * pop + wob, 0.5 + 0.5 * pop + wob);
  outlinedText(m.big, 0, 0, bigPx, m.color);
  if (m.small) outlinedText(m.small, 0, Math.max(bigPx, 40) * 0.85, fitPx(m.small, Math.min(W * 0.045, 26), W * 0.92), '#ffffff');
  ctx.restore();
}

function drawCallout() {              // announcer banner (slides in like on TV)
  const c = G.callout; if (!c) return;
  const slide = Math.min(1, c.t / 0.15), fade = c.t > c.dur - 0.3 ? (c.dur - c.t) / 0.3 : 1;
  const px = fitPx(c.text, clamp(Math.min(W, H) * 0.065, 18, 36), W * 0.8);
  ctx.save(); ctx.font = font(px); const tw = ctx.measureText(c.text).width + px * 1.6, th = px * 1.5;
  const cx = W / 2 - (1 - slide) * W * 0.6, cy = SAFE.t + Math.max(122, H * 0.17);
  ctx.globalAlpha = clamp(fade, 0, 1); ctx.translate(cx, cy); ctx.transform(1, 0, -0.18, 1, 0, 0);
  ctx.fillStyle = '#14161b'; ctx.fillRect(-tw / 2 + 5, -th / 2 + 5, tw, th);
  ctx.fillStyle = GOLD; ctx.fillRect(-tw / 2, -th / 2, tw, th);
  ctx.fillStyle = '#e8590c'; ctx.fillRect(-tw / 2, th / 2 - 5, tw, 5);
  ctx.fillStyle = '#14161b'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(c.text, 0, 2);
  ctx.restore();
}

function drawConfetti() {
  G.confetti.forEach(p => { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); });
}

function drawOverlayPanel(lines) {   // lines: [{text, size, color}]
  const pw = Math.min(W * 0.9, 560);
  lines = lines.map(l => ({ ...l, size: fitPx(l.text, l.size, pw - 36) }));
  const total = lines.reduce((a, l) => a + l.size * 1.35, 0) + 40;
  const px = (W - pw) / 2, py = (H - total) / 2;
  ctx.fillStyle = 'rgba(27,30,36,0.9)'; roundRect(px, py, pw, total, 18); ctx.fill();
  ctx.strokeStyle = GOLD; ctx.lineWidth = 3; ctx.stroke();
  let y = py + 20;
  lines.forEach(l => { y += l.size * 0.675; outlinedText(l.text, W / 2, y, l.size, l.color || '#ffffff', '#0b0c0f'); y += l.size * 0.675; });
}

function recordText(s) {
  const games = s.w + s.l + s.t;
  if (!games) return 'Win games to build your record!';
  return `RECORD ${s.w}-${s.l}${s.t ? '-' + s.t : ''}  ·  WIN STREAK ${s.streak}  ·  HIGH SCORE ${s.high}`;
}

function drawTitle() {
  ctx.fillStyle = 'rgba(12,16,22,0.6)'; ctx.fillRect(0, 0, W, H);
  const t = performance.now() / 1000, big = fitPx(CONFIG.GAME_TITLE, Math.min(H * 0.11, 80), W * 0.9);
  // title with silver look
  const ty = H * 0.12 + SAFE.t * 0.6;
  ctx.save(); ctx.font = font(big); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = big * 0.22; ctx.strokeStyle = '#14161b'; ctx.strokeText(CONFIG.GAME_TITLE, W / 2, ty);
  const g = ctx.createLinearGradient(0, ty - big / 2, 0, ty + big / 2);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#c9ced6'); g.addColorStop(0.55, '#9aa3b0'); g.addColorStop(1, '#e8ebef');
  ctx.fillStyle = g; ctx.fillText(CONFIG.GAME_TITLE, W / 2, ty); ctx.restore();
  const vs = `${CONFIG.MY_TEAM.name}  vs  ${CONFIG.OPP_TEAM.name}`, vpx = fitPx(vs, Math.max(16, big * 0.42), W * 0.9);
  ctx.font = font(vpx); const half = ctx.measureText('  vs  ').width / 2, wMe = ctx.measureText(CONFIG.MY_TEAM.name).width;
  const vy = ty + big * 0.95, left = W / 2 - ctx.measureText(vs).width / 2;
  outlinedText(CONFIG.MY_TEAM.name, left, vy, vpx, '#e6e9ee', '#14161b', 'left');
  outlinedText('vs', left + wMe + half, vy, vpx * 0.7, GOLD, '#14161b');
  outlinedText(CONFIG.OPP_TEAM.name, left + wMe + half * 2, vy, vpx, '#5b95ff', '#0b1c45', 'left');
  const sub = CONFIG.FIELD_NAME + '  ·  ' + CONFIG.GAME_SUBTITLE;
  outlinedText(sub, W / 2, vy + vpx * 1.1, fitPx(sub, Math.max(12, big * 0.24), W * 0.92), '#ffffff');
  // layout from the bottom up, so short (landscape phone) screens fit too
  const lines = touch.isTouchDevice
    ? ['PASS: pick a play, then drag to aim and let go to throw',
       'RUN: drag to run  ·  push far = TURBO  ·  JUKE button = spin move',
       'DEFENSE: drag to chase  ·  SWITCH (or tap a player) to change']
    : ['PASS: pick a play (1-4), then click & drag to aim, or SPACE for a quick pass',
       'RUN: arrows / WASD  ·  hold SHIFT = TURBO  ·  SPACE = JUKE spin move',
       'DEFENSE: arrows to chase  ·  SPACE switches to the player nearest the ball'];
  const hpx = Math.min(...lines.map(l => fitPx(l, 17, W * 0.94)));
  const hy = Math.min(H * 0.825, H - SAFE.b - hpx * 4.2);
  const startTxt = touch.isTouchDevice ? 'TAP TO PLAY' : 'PRESS START  (SPACE / TAP)';
  const spx = fitPx(startTxt, Math.min(34, H * 0.075), W * 0.8), bh = spx * 1.7;
  const startY = Math.min(H * 0.735, hy - hpx * 0.9 - bh / 2 - 6);
  const n = LEVELS.length, pgap = 10, pwid = Math.min(150, (W - 40 - pgap * (n - 1)) / n), phgt = clamp(H * 0.055, 32, 46);
  const py0 = Math.min(H * 0.585, startY - bh / 2 - 30 - phgt);
  const recY = Math.min(H * 0.515, py0 - 16);
  const subY = vy + vpx * 1.1;
  // a silver runner being chased by a blue Hawk (if there's room)
  const u = Math.min(Math.min(W, H) * 0.1, (recY - subY - 24) / 1.5), cy = Math.min(H * 0.45, recY - 16), run = t * 9;
  if (u > 22) {
    const rx = W / 2 + Math.sin(t * 1.2) * W * 0.06;
    drawFigure(rx + u * 0.9, cy, u, CONFIG.MY_TEAM, { num: CONFIG.MY_TEAM.numbers[0], skin: SKIN[0], hair: HAIR[1], anim: run, moving: true, hasBall: true });
    drawFigure(rx - u * 0.9, cy + u * 0.1, u * 0.95, CONFIG.OPP_TEAM, { num: CONFIG.OPP_TEAM.numbers[0], skin: SKIN[2], hair: HAIR[0], anim: run + 1, moving: true });
  }
  // your saved record
  if (!G.stats) G.stats = loadStats();
  const rec = recordText(G.stats);
  outlinedText(rec, W / 2, recY, fitPx(rec, 17, W * 0.92), GOLD);
  // level buttons
  const px0 = W / 2 - (n * pwid + (n - 1) * pgap) / 2;
  ui.levels = [];
  LEVELS.forEach((lv, i) => {
    const x = px0 + i * (pwid + pgap), sel = lv === G.level, lab = CONFIG.DIFFICULTY[lv].label;
    ui.levels[i] = { x, y: py0, w: pwid, h: phgt };
    ctx.fillStyle = sel ? GOLD : 'rgba(27,30,36,0.9)'; roundRect(x, py0, pwid, phgt, phgt / 2); ctx.fill();
    ctx.strokeStyle = sel ? '#ffffff' : 'rgba(255,255,255,0.5)'; ctx.lineWidth = sel ? 3 : 2; ctx.stroke();
    const lpx = fitPx(lab, phgt * 0.42, pwid - 14);
    ctx.font = font(lpx); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = sel ? '#14161b' : '#ffffff';
    ctx.fillText(lab, x + pwid / 2, py0 + phgt / 2 + 1);
  });
  const ltip = CONFIG.DIFFICULTY[G.level].tip + (touch.isTouchDevice ? '' : '   (keys 1 2 3)');
  outlinedText(ltip, W / 2, py0 + phgt + 14, fitPx(ltip, 14, W * 0.9), '#ffffff');
  // start button
  const pulse = 1 + 0.05 * Math.sin(t * 5);
  ctx.save(); ctx.translate(W / 2, startY); ctx.scale(pulse, pulse);
  ctx.font = font(spx); const bw = ctx.measureText(startTxt).width + spx * 1.4;
  ctx.fillStyle = '#e8590c'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
  roundRect(-bw / 2, -bh / 2, bw, bh, bh / 2); ctx.fill(); ctx.stroke();
  outlinedText(startTxt, 0, 2, spx, '#ffffff', '#7a2a00');
  ctx.restore();
  // how to play (short!)
  lines.forEach((l, i) => outlinedText(l, W / 2, hy + i * hpx * 1.5, hpx, '#ffffff'));
}

function drawGameOver() {
  const s = clamp(Math.min(W, H) * 0.07, 18, 44), win = G.score.me > G.score.opp, tie = G.score.me === G.score.opp;
  const st = G.stats || loadStats(), lines = [
    { text: `FINAL SCORE  ·  ${CONFIG.DIFFICULTY[G.level].label}`, size: s * 0.6, color: GOLD },
    { text: `${CONFIG.MY_TEAM.name} ${G.score.me}  -  ${G.score.opp} ${CONFIG.OPP_TEAM.name}`, size: s * 0.75 },
    { text: win ? 'YOU WIN!' : tie ? "IT'S A TIE!" : 'NICE TRY - PLAY AGAIN!', size: s * 1.2, color: win ? GOLD : '#ffffff' },
  ];
  if (G.newHigh) lines.push({ text: 'NEW HIGH SCORE!', size: s * 0.7, color: '#7CFC00' });
  lines.push({ text: recordText(st), size: s * 0.45, color: '#e6e9ee' });
  lines.push({ text: touch.isTouchDevice ? 'Tap to play again' : 'Press SPACE to play again', size: s * 0.5 });
  drawOverlayPanel(lines);
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawWorld();
  if (G.state === 'title') { drawTitle(); drawMuteButton(); }
  else {
    drawHUD(); drawPlayCall(); drawTouchControls(); drawMessage(); drawCallout();
    if (G.state === 'over') drawGameOver();
  }
  drawConfetti();
}

/* ==========================================================================
   12) MAIN LOOP
   ========================================================================== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  try { update(dt); render(); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
Sound.init(); resize(); buildScenery();
try { const lv = localStorage.getItem('egff_level'); if (CONFIG.DIFFICULTY[lv]) G.level = lv; } catch (e) {}
applyLevel(G.level); setupPlay(); G.state = 'title';
touch.isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
window.__game = G;   // handy for testing
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));   // offline play after first visit
}
requestAnimationFrame(frame);
</script>
</body>
</html>
